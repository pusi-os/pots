name: Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      github.actor != 'github-actions[bot]'

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref }}

      - name: Check if fork PR
        id: fork-check
        if: github.event_name == 'pull_request'
        run: |
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "is_fork=true" >> $GITHUB_OUTPUT
          else
            echo "is_fork=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set execution flag for gradlew
        run: chmod +x gradlew

      - name: Verify Java version
        run: |
          echo "JAVA_HOME: $JAVA_HOME"
          java -version

      - name: Run spotlessApply
        run: ./gradlew spotlessApply --no-daemon --stacktrace

      - name: Run updateScreenshots
        run: ./gradlew :screenshotTests:updateScreenshots --no-daemon --stacktrace

      - name: Install cwebp
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Convert site images to WebP
        run: ./scripts/convert-site-images-to-webp.sh

      - name: Run desktop tests
        run: ./gradlew :composeApp:desktopTest --no-daemon --stacktrace

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Fail if fork PR has changes
        if: |
          steps.changes.outputs.has_changes == 'true' &&
          steps.fork-check.outputs.is_fork == 'true'
        run: |
          echo "::error::This PR from a fork requires formatting or screenshot updates."
          echo "Please run the following commands locally and push the changes:"
          echo "  ./gradlew spotlessApply"
          echo "  ./gradlew :screenshotTests:updateScreenshots"
          echo "  ./scripts/convert-site-images-to-webp.sh"
          exit 1

      - name: Commit and push changes
        if: |
          steps.changes.outputs.has_changes == 'true' &&
          (github.event_name == 'push' || steps.fork-check.outputs.is_fork == 'false')
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "Auto-fix: spotlessApply and updateScreenshots [skip ci]"
          git push

  # Compiles androidMain/androidApp so cards touching the manifest, QS tile,
  # overlay or FGS services get a real build check in CI instead of a 30-minute
  # local assembleFossDebug on the Pi5.
  # Step set mirrors the APK job in release.yml (proven on ubuntu-latest).
  android:
    name: Assemble Android Debug
    runs-on: ubuntu-latest
    if: |
      !contains(github.event.head_commit.message, '[skip ci]') &&
      github.actor != 'github-actions[bot]'

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set execution flag for gradlew
        run: chmod +x gradlew

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android Build Tools
        run: |
          sdkmanager "build-tools;36.0.0"
          sdkmanager "build-tools;29.0.3"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-android-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-android-
            ${{ runner.os }}-gradle-

      - name: Build the Hermes web panel bundle
        # The panel's renderer is built here and shipped inside the APK: the
        # sandbox cannot run its pnpm install under --link2symlink.
        uses: ./.github/actions/hermes-webapp-bundle

      - name: Assemble FOSS debug APK
        run: ./gradlew :androidApp:assembleFossDebug --no-daemon --stacktrace

      - name: Verify the APK carries the panel bundle as one archive
        run: |
          set -euo pipefail
          APK=androidApp/build/outputs/apk/foss/debug/androidApp-foss-debug.apk
          unzip -l "$APK" | grep 'assets/hermes-webapp/'
          # One archive, not the bundle's thousand-odd files unpacked into the APK.
          test "$(unzip -l "$APK" | grep -c 'assets/hermes-webapp/dist.tar.xz')" -eq 1
          test "$(unzip -l "$APK" | grep -c 'assets/hermes-webapp/pin')" -eq 1
          test "$(unzip -l "$APK" | grep -c 'assets/hermes-webapp/dist-webapp/')" -eq 0
