name: Build and Release

on:
  push:
    tags:
      - 'v*'
  # Manual trigger so a release build can be re-run without re-tagging
  # (a tag pointing at a [skip ci] commit silently skips the tag event).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Generate APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set execution flag for gradlew
        run: chmod +x gradlew
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install Android Build Tools
        run: |
          sdkmanager "build-tools;36.0.0"
          sdkmanager "build-tools;29.0.3"
      - name: Build APK
        env:
          # Sign with the committed FOSS release key so every GitHub APK
          # shares one signature and updates install over previous builds.
          # The key and password are public on purpose: this is the open
          # distribution channel, not the Play upload key.
          KEYSTORE_FILE: ${{ github.workspace }}/androidApp/foss-release.keystore
          KEYSTORE_PASSWORD: pots-foss-key
          KEY_ALIAS: pots-foss
        run: bash ./gradlew :androidApp:assembleFossRelease --stacktrace
      - name: Verify APK signing certificate
        env:
          KEYSTORE_PASSWORD: pots-foss-key
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          APK="androidApp/build/outputs/apk/foss/release/androidApp-foss-release.apk"
          EXPECTED="$(keytool -list -v -keystore androidApp/foss-release.keystore -storepass "$KEYSTORE_PASSWORD" \
              | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" \
              | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          echo "expected $EXPECTED"; echo "actual   $ACTUAL"
          test -n "$EXPECTED" -a -n "$ACTUAL" -a "$EXPECTED" = "$ACTUAL"
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: androidApp/build/outputs/apk/foss/release/androidApp-foss-release.apk

  dmg:
    name: Generate DMG
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set execution flag for gradlew
        run: chmod +x gradlew
      - name: Build DMG
        run: bash ./gradlew packageReleaseDmg --stacktrace
      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-package
          path: composeApp/build/compose/binaries/main-release/dmg/*.dmg

  msi:
    name: Generate MSI
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build MSI
        run: ./gradlew packageReleaseMsi --stacktrace
      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: msi-package
          path: composeApp/build/compose/binaries/main-release/msi/*.msi

  deb:
    name: Generate DEB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set execution flag for gradlew
        run: chmod +x gradlew
      - name: Build DEB
        run: ./gradlew packageReleaseDeb --stacktrace
      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: composeApp/build/compose/binaries/main-release/deb/*.deb

  rpm:
    name: Generate RPM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set execution flag for gradlew
        run: chmod +x gradlew
      - name: Install RPM build tools
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build RPM
        run: ./gradlew packageReleaseRpm --stacktrace
      - name: Upload RPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: composeApp/build/compose/binaries/main-release/rpm/*.rpm

  linux-tar:
    name: Generate Linux Tarball
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set execution flag for gradlew
        run: chmod +x gradlew
      - name: Build application distribution
        run: ./gradlew createReleaseDistributable --stacktrace
      - name: Create tarball
        run: |
          cd composeApp/build/compose/binaries/main-release/app
          tar czf "$GITHUB_WORKSPACE/Pots-linux-x86_64.tar.gz" Pots
      - name: Upload Tarball Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-tar-package
          path: Pots-linux-x86_64.tar.gz

  appimage:
    name: Generate AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set execution flag for gradlew
        run: chmod +x gradlew
      - name: Install AppImage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 file
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
      - name: Build application distribution
        run: ./gradlew createReleaseDistributable --stacktrace
      - name: Create AppDir structure
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/lib
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          # Copy distributable contents
          cp -r composeApp/build/compose/binaries/main-release/app/Pots/* AppDir/usr/lib/

          # Copy icon
          cp composeApp/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/pots.png
          cp composeApp/icon.png AppDir/pots.png

          # Create desktop file
          cat > AppDir/pots.desktop << 'EOF'
          [Desktop Entry]
          Name=Pots
          Comment=AI Assistant Application
          Exec=pots
          Icon=pots
          Type=Application
          Categories=Utility;
          Terminal=false
          EOF
          cp AppDir/pots.desktop AppDir/usr/share/applications/

          # Create AppRun
          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/lib/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib/lib/runtime/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/lib/bin/Pots" "$@"
          EOF
          chmod +x AppDir/AppRun
      - name: Build AppImage
        run: |
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir Pots-x86_64.AppImage
      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage-package
          path: Pots-*.AppImage

  flatpak:
    name: Generate Flatpak
    needs: [linux-tar]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Download Linux Tarball
        uses: actions/download-artifact@v4.1.7
        with:
          name: linux-tar-package
      - name: Install Flatpak and Builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08
      - name: Build Flatpak
        run: |
          # Copy tarball to flatpak dir and compute sha256
          cp Pots-linux-x86_64.tar.gz flatpak/
          SHA256=$(sha256sum Pots-linux-x86_64.tar.gz | cut -d' ' -f1)

          # Patch manifest to use local tarball instead of URL
          cd flatpak
          sed -i "s|url: https://github.com/pusi-os/pots/releases/download/.*|path: Pots-linux-x86_64.tar.gz|" io.github.pusi.Pots.yaml
          sed -i "s|sha256: .*|sha256: ${SHA256}|" io.github.pusi.Pots.yaml

          # Build and bundle
          flatpak-builder --repo=repo --force-clean build-dir io.github.pusi.Pots.yaml
          flatpak build-bundle repo ../Pots.flatpak io.github.pusi.Pots
      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-package
          path: Pots.flatpak


  release:
    name: Release APK, DMG, MSI, DEB, RPM, AppImage, Flatpak and Tarball
    needs: [apk, dmg, msi, deb, rpm, appimage, linux-tar, flatpak]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Download APK Artifact
        uses: actions/download-artifact@v4.1.7
        with:
          name: android-apk

      - name: Download DMG Artifact
        uses: actions/download-artifact@v4.1.7
        with:
          name: dmg-package

      - name: Download MSI Artifact
        uses: actions/download-artifact@v4.1.7
        with:
          name: msi-package

      - name: Download DEB Artifact
        uses: actions/download-artifact@v4.1.7
        with:
          name: deb-package

      - name: Download RPM Artifact
        uses: actions/download-artifact@v4.1.7
        with:
          name: rpm-package

      - name: Download AppImage Artifact
        uses: actions/download-artifact@v4.1.7
        with:
          name: appimage-package

      - name: Download Linux Tarball Artifact
        uses: actions/download-artifact@v4.1.7
        with:
          name: linux-tar-package

      - name: Download Flatpak Artifact
        uses: actions/download-artifact@v4.1.7
        with:
          name: flatpak-package

      - name: List downloaded files (for debugging)
        run: ls -la

      - name: Rename assets
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mv androidApp-foss-release.apk "Pots-${VERSION}-android.apk"
          mv *.dmg "Pots-${VERSION}-macos.dmg"
          mv *.msi "Pots-${VERSION}-windows.msi"
          mv *.deb "Pots-${VERSION}-linux.deb"
          mv *.rpm "Pots-${VERSION}-linux.rpm"
          mv *.AppImage "Pots-${VERSION}-linux.AppImage"
          mv Pots-linux-x86_64.tar.gz "Pots-${VERSION}-linux-x86_64.tar.gz"
          mv Pots.flatpak "Pots-${VERSION}-linux.flatpak"

      - name: Extract changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -f CHANGELOG.md ]; then
            sed -n "/^## v${VERSION}/,/^## v/{ /^## v${VERSION}/d; /^## v/d; p; }" CHANGELOG.md > changelog.txt
          fi
          # Fallback if CHANGELOG.md missing or section empty
          if [ ! -s changelog.txt ]; then
            PREVIOUS_TAG=$(git tag --sort=-creatordate | grep -v "^${GITHUB_REF_NAME}$" | head -n1)
            if [ -z "$PREVIOUS_TAG" ]; then
              git log --pretty=format:"- %s" "${GITHUB_REF_NAME}" > changelog.txt
            else
              git log --pretty=format:"- %s" "${PREVIOUS_TAG}..${GITHUB_REF_NAME}" --no-merges > changelog.txt
            fi
          fi

      - name: Create Github Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body_path: changelog.txt
          files: Pots-*

      - name: Sync winget-pkgs fork
        # Optional: skipped harmlessly when WINGET_TOKEN is not configured.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: gh repo sync pusi-os/winget-pkgs --source microsoft/winget-pkgs --branch master --force

      - name: Publish to WinGet
        continue-on-error: true
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: pusi-os.Pots
          installers-regex: '\.msi$'
          token: ${{ secrets.WINGET_TOKEN }}