site_name: Pots Documentation
site_url: https://pusi-os.github.io/pots/docs/
site_description: Documentation for Pots - AI Assistant App

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - search.highlight
    - content.tabs.link

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Features:
    - Chat & Conversations: features/chat.md
    - Hands-Free Voice Mode: features/hands-free.md
    - Multi-Service: features/multi-service.md
    - Tools: features/tools.md
    - MCP Servers: features/mcp.md
    - Dynamic UI: features/dynamic-ui.md
    - Mini-apps: features/mini-apps.md
    - Mini-app server: features/mini-app-server.md
    - Memories: features/memories.md
    - Heartbeat: features/heartbeat.md
    - Tasks: features/tasks.md
    - Daemon: features/daemon.md
    - Encryption: features/encryption.md
    - On-Device Inference: features/on-device-inference.md
    - Reasoning: features/reasoning.md
    - System Prompts: features/system-prompts.md
    - Skills: features/skills.md
    - Linux Sandbox: features/sandbox.md
    - Pots Build: features/pots-build.md
    - Notifications: features/notifications.md
    - SMS: features/sms.md
    - Appearance: features/appearance.md
    - Потсики (Character): features/potsiki.md
    - Settings Export & Import: features/settings-export-import.md
    - Splinterlands: features/splinterlands.md
  - Desktop Release Smoke Test: desktop-release-smoketest.md
